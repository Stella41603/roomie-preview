<script>
function isSafeRecordId(value) {
  return (
    typeof value === "string" &&
    value.length <= 120 &&
    /^[A-Za-z0-9]/.test(value) &&
    !/[^A-Za-z0-9_-]/.test(value)
  );
}
const MEMBER_IDS = ["Alex", "Jamie", "Taylor", "Sam"];
function parseMoney(value) {
  const raw = String(value).trim();
  if (!/^\d+(\.\d{1,2})?$/.test(raw))
    throw new Error("Enter an amount with at most two decimal places.");
  const [whole, decimal = ""] = raw.split(".");
  const cents = Number(whole) * 100 + Number(decimal.padEnd(2, "0"));
  if (!Number.isSafeInteger(cents) || cents < 1 || cents > 100000000)
    throw new Error("Enter an amount between $0.01 and $1,000,000.00.");
  return cents;
}
function splitCents(cents, participants) {
  if (!Number.isSafeInteger(cents) || cents < 1)
    throw new Error("Invalid expense amount.");
  const ids = [...new Set(participants)].sort();
  if (!ids.length || ids.some((id) => !MEMBER_IDS.includes(id)))
    throw new Error("Choose at least one roommate.");
  return Object.fromEntries(
    ids.map((id, i) => [
      id,
      Math.floor(cents / ids.length) + (i < cents % ids.length ? 1 : 0),
    ]),
  );
}
function balances(data) {
  const result = Object.fromEntries(MEMBER_IDS.map((id) => [id, 0]));
  for (const expense of data.expenses) {
    if (!expense.paid) continue;
    const shares = splitCents(expense.cents, expense.participants);
    result[expense.payer] += expense.cents;
    for (const [id, cents] of Object.entries(shares)) result[id] -= cents;
  }
  for (const item of data.settlements) {
    result[item.from] += item.cents;
    result[item.to] -= item.cents;
  }
  return result;
}
function settlementPlan(data) {
  const all = balances(data);
  const debt = MEMBER_IDS.filter((id) => all[id] < 0).map((id) => ({
    id,
    cents: -all[id],
  }));
  const credit = MEMBER_IDS.filter((id) => all[id] > 0).map((id) => ({
    id,
    cents: all[id],
  }));
  const result = [];
  let i = 0,
    j = 0;
  while (i < debt.length && j < credit.length) {
    const cents = Math.min(debt[i].cents, credit[j].cents);
    result.push({ from: debt[i].id, to: credit[j].id, cents });
    debt[i].cents -= cents;
    credit[j].cents -= cents;
    if (!debt[i].cents) i++;
    if (!credit[j].cents) j++;
  }
  return result;
}
function nextDue(date, repeat) {
  const d = new Date(date + "T12:00:00");
  if (repeat === "Daily") d.setDate(d.getDate() + 1);
  else if (repeat === "Weekly") d.setDate(d.getDate() + 7);
  else if (repeat === "Monthly") {
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + 2);
    d.setDate(0);
    d.setDate(Math.min(day, d.getDate()));
  } else return date;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function validateData(data) {
  const fail = () => {
    throw new Error("This file is not a valid Roomie product backup.");
  };
  if (
    data?.version !== 2 ||
    !MEMBER_IDS.includes(data.viewer) ||
    typeof data.houseName !== "string" ||
    !data.houseName.trim() ||
    data.houseName.length > 80
  )
    fail();
  for (const key of [
    "expenses",
    "shopping",
    "chores",
    "settlements",
    "activity",
  ])
    if (!Array.isArray(data[key]) || data[key].length > 10000) fail();
  const text = (x) =>
    typeof x === "string" && x.trim().length > 0 && x.length <= 120;
  const date = (x) =>
    typeof x === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(x) &&
    !isNaN(new Date(x + "T12:00:00").getTime()) &&
    new Date(x + "T12:00:00").toISOString().slice(0, 10) === x;
  const amount = (x) => Number.isSafeInteger(x) && x > 0 && x <= 100000000;
  for (const key of [
    "expenses",
    "shopping",
    "chores",
    "settlements",
    "activity",
  ]) {
    const seen = new Set();
    for (const item of data[key]) {
      if (!item || !isSafeRecordId(item.id) || seen.has(item.id)) fail();
      seen.add(item.id);
    }
  }
  for (const e of data.expenses) {
    if (
      !text(e.name) ||
      !amount(e.cents) ||
      !MEMBER_IDS.includes(e.payer) ||
      typeof e.paid !== "boolean" ||
      !date(e.date) ||
      !["Housing", "Utilities", "Groceries", "Other"].includes(e.category) ||
      !Array.isArray(e.participants) ||
      new Set(e.participants).size !== e.participants.length
    )
      fail();
    splitCents(e.cents, e.participants);
  }
  for (const s of data.shopping)
    if (
      !text(s.name) ||
      !amount(s.cents) ||
      !MEMBER_IDS.includes(s.owner) ||
      typeof s.done !== "boolean" ||
      (s.expenseId !== undefined && !isSafeRecordId(s.expenseId))
    )
      fail();
  for (const c of data.chores)
    if (
      !text(c.name) ||
      !MEMBER_IDS.includes(c.owner) ||
      !date(c.due) ||
      typeof c.done !== "boolean" ||
      !["Daily", "Weekly", "Monthly", "One time"].includes(c.repeat)
    )
      fail();
  for (const s of data.settlements)
    if (
      !MEMBER_IDS.includes(s.from) ||
      !MEMBER_IDS.includes(s.to) ||
      s.from === s.to ||
      !amount(s.cents) ||
      !date(s.date)
    )
      fail();
  for (const a of data.activity)
    if (
      typeof a.text !== "string" ||
      !a.text.trim() ||
      a.text.length > 250 ||
      typeof a.detail !== "string" ||
      a.detail.length > 250 ||
      !["Expenses", "Purchases", "Chores", "Household"].includes(a.type) ||
      !MEMBER_IDS.includes(a.actor) ||
      typeof a.at !== "string" ||
      isNaN(Date.parse(a.at))
    )
      fail();
  for (const c of data.chores) {
    if (c.nextId !== undefined) {
      if (
        !isSafeRecordId(c.nextId) ||
        !c.done ||
        !data.chores.some((n) => n.id === c.nextId)
      )
        fail();
      const visited = new Set([c.id]);
      let n = c;
      while (n.nextId) {
        if (visited.has(n.nextId)) fail();
        visited.add(n.nextId);
        n = data.chores.find((x) => x.id === n.nextId);
        if (!n) fail();
      }
    }
    if (c.modified !== undefined && typeof c.modified !== "boolean") fail();
  }
  return data;
}

      if (expense && source?.purchaseId) {
        const purchase = state.shopping.find((s) => s.id === source.purchaseId);
        purchase.expenseId = record.id;
        delete record.purchaseId;
      }
      finish(
        `${me()} ${existing ? "updated" : "added"} ${name}`,
        expense ? money(record.cents) + " · " + record.payer + " paid" : owner,
        expense ? "Expenses" : chore ? "Chores" : "Purchases",
      );
    },
  );
  if(expense){
    const update=()=>{
      const panel=$("split-preview"),fd=new FormData($("form"));
      try{const cents=parseMoney(fd.get("amount"));const people=fd.getAll("participants");const shares=splitCents(cents,people);panel.innerHTML=`<div class="split-title"><strong>Everyone’s share</strong><span>${people.length} people · ${money(cents)}</span></div>${Object.entries(shares).map(([name,value])=>`<div class="split-person"><span>${esc(name)}${name===fd.get("owner")?' · Pays upfront':''}</span><strong>${money(value)}</strong></div>`).join('')}<p>Equal split.${fd.get("status")==='planned'?' Included after payment.':''}</p>`;}
      catch{panel.innerHTML='<strong>Everyone’s share</strong><p>Enter an amount and select roommates.</p>';}
    };
    $("form").oninput=()=>{modalDirty=true;update();};$("form").onchange=()=>{modalDirty=true;update();};update();
  }
}

function markPaid(id) {
  const e = state.expenses.find((x) => x.id === id);
  if (!e || e.paid) return;
  modal(
    "Record bill as paid",
    `<p>${esc(e.payer)} paid ${money(e.cents)} for ${esc(e.name)}?</p><p class="note">This updates household balances. No money is transferred.</p><button class="btn" type="submit">Confirm paid</button>`,
    () => {
      e.paid = true;
      finish(
        `${me()} recorded ${e.name} as paid`,
        e.payer + " · " + money(e.cents),
        "Expenses",
      );
    },
  );
}
function expenseDetails(id) {
  const e = state.expenses.find((x) => x.id === id);
  if (!e) return;
  modal(
    e.name,
    `<p>${esc(e.payer)} paid ${money(e.cents)} · ${e.date}</p>${Object.entries(
      splitCents(e.cents, e.participants),
    )
      .map(
        ([name, cents]) =>
          `<div class="settings-row"><strong>${name}</strong><span>${money(cents)}</span></div>`,
      )
      .join(
        "",
      )}<button class="btn" type="button" onclick="openAdd('expense','${id}')">Edit expense</button>`,
    () => {},
  );
}
function toggleShopping(id) {
  const s = state.shopping.find((x) => x.id === id);
  if (!s) return;
  s.done = !s.done;
  const saved = log(
    `${me()} ${s.done ? "purchased" : "marked to buy"} ${s.name}`,
    money(s.cents),
    "Purchases",
  );
  render();
  toast(
    saved
      ? s.done
        ? "Marked as purchased"
        : "Moved to shopping list"
      : "Updated in this tab only. Export a backup before closing.",
  );
}
function purchaseExpense(id) {
  const s = state.shopping.find((x) => x.id === id);
  if (!s || !s.done || s.expenseId) return;
  openAdd("expense", null, {
    name: s.name,
    cents: s.cents,
    payer: s.owner,
    category: "Groceries",
    purchaseId: id,
    paid: true,
  });
}
function toggleChore(id) {
  const c = state.chores.find((x) => x.id === id);
  if (!c) return;
  if (c.done && c.nextId) {
    const next = state.chores.find((x) => x.id === c.nextId);
    if (next && (next.done || next.modified)) {
      toast(
        "The next occurrence was edited or completed. Delete it before reopening this one.",
      );
      return;
    }
    state.chores = state.chores.filter((x) => x.id !== c.nextId);
    delete c.nextId;
  }
  c.done = !c.done;
  if (c.done && c.repeat !== "One time") {
    const next = {
      id: uid(),
      name: c.name,
      owner: c.owner,
      due: nextDue(c.due, c.repeat),
      repeat: c.repeat,
      done: false,
    };
    state.chores.unshift(next);
    c.nextId = next.id;
  }
  const saved = log(
    `${me()} ${c.done ? "completed" : "reopened"} ${c.name}`,
    c.done && c.repeat !== "One time" ? "Next occurrence scheduled" : c.owner,
    "Chores",
  );
  render();
  toast(
    saved
      ? c.done
        ? "Chore completed"
        : "Chore reopened"
      : "Updated in this tab only. Export a backup before closing.",
  );
}
function openSettle() {
  const plan = settlementPlan(state),
    item = plan.find((s) => s.from === me() || s.to === me()) || plan[0];
  if (!item) return toast("Everyone is already settled up.");
  modal(
    "Record a settlement",
    `<p>Record a transfer that already happened outside Roomie.</p><label for="from">From</label><select id="from" name="from">${options(item.from)}</select><label for="to">To</label><select id="to" name="to">${options(item.to)}</select><label for="amount">Amount · CAD</label><input id="amount" name="amount" inputmode="decimal" value="${(item.cents / 100).toFixed(2)}" required><button class="btn" type="submit">Record settlement</button>`,
    (fd) => {
      const from = fd.get("from"),
        to = fd.get("to"),
        cents = parseMoney(fd.get("amount")),
        all = balances(state);
      if (from === to || all[from] >= 0 || all[to] <= 0)
        throw new Error("Choose someone who owes and someone who is owed.");
      if (cents > Math.min(-all[from], all[to]))
        throw new Error("This amount is larger than the outstanding balance.");
      state.settlements.unshift({ id: uid(), from, to, cents, date: today() });
      finish(
        `${me()} recorded a settlement`,
        from + " → " + to + " · " + money(cents),
        "Expenses",
      );
    },
  );
}
function removeRecord(type, id) {
  const key = {
      expense: "expenses",
      purchase: "shopping",
      chore: "chores",
      settlement: "settlements",
    }[type],
    item = state[key].find((x) => x.id === id);
  if (!item) return;
  modal(
    `Delete ${type}?`,
    `<p>${type === "settlement" ? "Undo this settlement record?" : esc(item.name) + " will be removed."}</p><p class="note">Balances and totals will be recalculated.${type === "chore" && item.nextId ? " Only this occurrence will be deleted; its next occurrence will be kept." : ""}${type === "purchase" && item.expenseId ? " The linked expense will stay in Expenses." : ""}</p><button class="btn" type="submit">Confirm delete</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button>`,
    () => {
      state[key] = state[key].filter((x) => x.id !== id);
      if (type === "expense")
        for (const s of state.shopping)
          if (s.expenseId === id) delete s.expenseId;
      if (type === "chore") {
        for (const c of state.chores) if (c.nextId === id) delete c.nextId;
      }
      finish(
        `${me()} deleted a ${type}`,
        item.name || "Settlement record",
        type === "purchase"
          ? "Purchases"
          : type === "chore"
            ? "Chores"
            : "Expenses",
      );
    },
  );
}
function openHouse() {
  modal(
    "Household name",
    `<label for="name">Name</label><input id="name" name="name" maxlength="80" required value="${esc(state.houseName)}"><button type="submit" class="btn">Save name</button>`,
    (fd) => {
      const name = fd.get("name").trim();
      if (!name) throw new Error("Enter a house name.");
      state.houseName = name;
      finish(`${me()} renamed the household`, name, "Household");
    },
  );
}
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {
      type: "application/json",
    }),
    url = URL.createObjectURL(blob),
    a = document.createElement("a");
  a.href = url;
  a.download = "roomie-backup-" + today() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Backup exported");
}
async function importData(file) {
  if (!file) return;
  try {
    if (file.size > 2000000)
      throw new Error("Choose a Roomie backup smaller than 2 MB.");
    const incoming = validateData(JSON.parse(await file.text()));
    modal(
      "Replace saved data?",
      `<p>Import ${incoming.expenses.length} expenses, ${incoming.shopping.length} shopping items and ${incoming.chores.length} chores for ${esc(incoming.houseName)}?</p><p class="note">This replaces your saved data. Export a backup first to keep a copy.</p><button class="btn" type="submit">Import backup</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button>`,
      () => {
        state = incoming;
        const saved = persist();
        closeModal(true);
        render();
        toast(
          saved
            ? "Backup imported"
            : "Backup loaded in this tab only. Export before closing.",
        );
      },
    );
  } catch (error) {
    toast(
      error.message === "Unexpected end of JSON input"
        ? "This file is not valid JSON."
        : error.message,
    );
  }
}
function openReset() {
  modal(
    "Restore sample data?",
    `<p>This replaces your local entries with the sample household. Export a backup first if you want to keep your records.</p><button class="btn" type="submit">Restore samples</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button>`,
    () => {
      state = seed();
      const saved = persist();
      closeModal(true);
      render();
      toast(
        saved
          ? "Sample household restored"
          : "Samples restored in this tab only. Browser saving is unavailable.",
      );
    },
  );
}
const fileInput = document.createElement("input");
fileInput.id = "import-file";
fileInput.type = "file";
fileInput.accept = ".json,application/json";
fileInput.hidden = true;
fileInput.addEventListener("change", () => {
  importData(fileInput.files[0]);
  fileInput.value = "";
});
document.body.append(fileInput);
$("modal").addEventListener("click", (e) => {
  if (e.target === $("modal")) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (!$("modal").classList.contains("show")) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "Tab") {
    const els = [...$("modal").querySelectorAll("button,input,select")].filter(
        (el) => !el.disabled,
      ),
      first = els[0],
      last = els.at(-1);
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});
render();
if (!loadIssue) persist();
if (loadIssue)
  toast(
    "Your saved data could not be opened. It has not been overwritten. Import a backup or restore sample data in Settings.",
  );

window.addEventListener("beforeunload", (e) => {
  if (storageFailed || modalDirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

</script></body></html>
